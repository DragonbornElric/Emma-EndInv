// Convention plugin for the folia/ subproject.
// Uses paperweight-userdev to compile against Mojang-mapped Folia NMS.
// Consumes commonServerJava (a filtered zip of common sources that excludes
// client-only packages) and provides its own overrides for files with
// inescapable client-class references (toClient payloads, ModPacketPayload, PageType).

plugins {
    id 'java-library'
    id 'io.papermc.paperweight.userdev'
}

paperweight {
    // Folia 1.20.1 runs the Spigot-obfuscated production namespace.
    reobfArtifactConfiguration =
            io.papermc.paperweight.userdev.ReobfArtifactConfiguration.getREOBF_PRODUCTION()
}

base {
    archivesName = "${mod_id}-folia-${minecraft_version}"
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(java_version)
    withSourcesJar()
}

sourcesJar {
    from(rootProject.file('LICENSE')) {
        rename { "${it}_${mod_id}" }
    }
}

jar {
    from(rootProject.file('LICENSE')) {
        rename { "${it}_${mod_id}" }
    }
    manifest {
        attributes([
                'Specification-Title'   : mod_name,
                'Specification-Version' : project.jar.archiveVersion,
                'Implementation-Title'  : project.name,
                'Implementation-Version': project.jar.archiveVersion,
                'Built-On-Minecraft'    : minecraft_version
        ])
    }
}

configurations {
    commonServerJava {
        canBeResolved = true
    }
    commonResources {
        canBeResolved = true
    }
}

dependencies {
    paperweight.foliaDevBundle("${folia_version}")

    commonServerJava project(path: ':common', configuration: 'commonServerJava')
    commonResources project(path: ':common', configuration: 'commonResources')
}

// Unzip commonServerJava (filtered zip) into the compile source tree
tasks.named('compileJava', JavaCompile) {
    dependsOn(configurations.commonServerJava)
    source {
        configurations.commonServerJava.collect { zip -> project.zipTree(zip) }
    }
}

processResources {
    from(rootProject.file('common/src/main/resources'))
    // Folia replaces the loader mixins with Bukkit/Paper event adapters. Do
    // not package client-loader metadata that Paper cannot and should not
    // consume; shared language and image assets remain available.
    exclude 'endless_inventory.mixins.json'
    exclude 'endinv.accesswidener'
    exclude 'META-INF/accesstransformer.cfg'
    exclude 'pack.mcmeta'

    inputs.property('version', project.version)
    filesMatching('paper-plugin.yml') {
        expand(version: project.version)
    }
}

tasks.named('sourcesJar', Jar) {
    dependsOn(configurations.commonServerJava)
    from {
        configurations.commonServerJava.collect { zip -> project.zipTree(zip) }
    }
    from(rootProject.file('common/src/main/resources'))
}

tasks.named('assemble') {
    // The plain jar is Mojang-mapped and carries a -dev classifier. Folia
    // 1.20.1 must receive paperweight's Spigot-obfuscated production jar.
    dependsOn(tasks.named('reobfJar'))
}
