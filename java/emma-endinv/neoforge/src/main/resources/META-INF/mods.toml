modLoader = "javafml"
loaderVersion = "${neoforge_loader_version_range}"
license = "${license}"
accessTransformer = "META-INF/accesstransformer.cfg"

[[mods]]
modId = "${mod_id}"
version = "${version}"
displayName = "Endless Inventory (Emma Fork)"
displayTest = "IGNORE_SERVER_VERSION"
description = '''RPG-style infinite inventory for Minecraft 1.20.1, with Emma's multiloader feature set.'''

[[mixins]]
config = "${mod_id}.mixins.json"

[[mixins]]
config = "${mod_id}.neoforge.mixins.json"

[[dependencies.${mod_id}]]
modId = "forge"
mandatory = true
versionRange = "${neoforge_loader_version_range}"
ordering = "NONE"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "minecraft"
mandatory = true
versionRange = "${minecraft_version_range}"
ordering = "NONE"
side = "BOTH"
