pluginManagement {
    repositories {
        gradlePluginPortal()
        mavenCentral()
        maven {
            name = 'PaperMC'
            url = uri('https://repo.papermc.io/repository/maven-public/')
        }
        exclusiveContent {
            forRepository {
                maven {
                    name = 'Fabric'
                    url = uri('https://maven.fabricmc.net')
                }
            }
            filter {
                includeGroupAndSubgroups('net.fabricmc')
            }
        }
    }
}

plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0'
}

rootProject.name = 'emma-endinv'
include('common')
include('fabric')
include('neoforge')
// Folia ships later than Minecraft: leave folia_version empty in gradle.properties when there is
// no Folia build for this Minecraft version yet, and the folia module is left out.
if (!providers.gradleProperty('folia_version').getOrElse('').isBlank()) {
    include('folia')
}
