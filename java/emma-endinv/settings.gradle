pluginManagement {
    repositories {
        gradlePluginPortal()
        mavenCentral()
        maven {
            name = 'PaperMC'
            url = uri('https://repo.papermc.io/repository/maven-public/')
        }
        exclusiveContent {
            forRepository {
                maven {
                    name = 'Fabric'
                    url = uri('https://maven.fabricmc.net')
                }
            }
            filter {
                includeGroupAndSubgroups('net.fabricmc')
            }
        }
    }
}

plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0'
}

rootProject.name = 'emma-endinv'
include('common')
include('fabric')
include('neoforge')
// The server plugin (folia module) compiles against folia_version, or against paper_version when
// Folia has no build for this Minecraft version yet. With neither set the module is left out.
if (!providers.gradleProperty('folia_version').getOrElse('').isBlank()
        || !providers.gradleProperty('paper_version').getOrElse('').isBlank()) {
    include('folia')
}
